<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with Safe Margin (Maskable friendly) -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" />

  <!-- Outer Golden Crest Border -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" stroke-dasharray="8 6" />

  <!-- Shield Base -->
  <path d="M 256 90 L 380 150 C 380 290 256 390 256 390 C 256 390 132 290 132 150 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#glow)" />

  <!-- Inner Shield Detail -->
  <path d="M 256 120 L 350 170 C 350 270 256 350 256 350 C 256 350 162 270 162 170 Z" 
        fill="#090d16" opacity="0.7" stroke="#38bdf8" stroke-width="3" />

  <!-- Crossed Swords (Esports Draft Theme) -->
  <g stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round">
    <!-- Sword 1 -->
    <line x1="180" y1="330" x2="332" y2="178" />
    <!-- Sword 2 -->
    <line x1="332" y1="330" x2="180" y2="178" />
  </g>

  <!-- Center Gem (Diamond / RoV Power Core) -->
  <polygon points="256,190 286,240 256,290 226,240" fill="#38bdf8" stroke="#ffffff" stroke-width="4" filter="url(#glow)" />

  <!-- RoV Banner Badge -->
  <rect x="156" y="380" width="200" height="42" rx="8" fill="#ca8a04" stroke="#fde047" stroke-width="3" />
  <text x="256" y="410" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#020617" text-anchor="middle" letter-spacing="3">
    ROV DRAFT
  </text>
</svg>
